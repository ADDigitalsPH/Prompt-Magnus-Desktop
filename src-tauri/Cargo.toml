[package]
name = "prompt-magnus-desktop"
version = "0.1.0"
description = "A local-first desktop prompt launcher."
authors = ["Prompt Magnus"]
license = "MIT"
edition = "2021"

[lib]
name = "prompt_magnus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
arboard = "3.6.1"
tauri = { version = "2.5.0", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.2.0"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
