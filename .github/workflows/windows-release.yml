name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

env:
  SIGNPATH_ORGANIZATION_ID: REPLACE_WITH_SIGNPATH_ORGANIZATION_ID
  SIGNPATH_PROJECT_SLUG: REPLACE_WITH_SIGNPATH_PROJECT_SLUG
  SIGNPATH_SIGNING_POLICY_SLUG: REPLACE_WITH_SIGNPATH_SIGNING_POLICY_SLUG
  HAS_SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows app
        run: npm run tauri build

      - name: Upload unsigned Windows artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-magnus-desktop-windows-unsigned
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.zip
          if-no-files-found: error

      - name: Submit SignPath signing request
        if: ${{ env.HAS_SIGNPATH_API_TOKEN == 'true' && env.SIGNPATH_ORGANIZATION_ID != 'REPLACE_WITH_SIGNPATH_ORGANIZATION_ID' && env.SIGNPATH_PROJECT_SLUG != 'REPLACE_WITH_SIGNPATH_PROJECT_SLUG' && env.SIGNPATH_SIGNING_POLICY_SLUG != 'REPLACE_WITH_SIGNPATH_SIGNING_POLICY_SLUG' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(github.ref_name) }}

      - name: Upload signed Windows artifacts
        if: ${{ env.HAS_SIGNPATH_API_TOKEN == 'true' && env.SIGNPATH_ORGANIZATION_ID != 'REPLACE_WITH_SIGNPATH_ORGANIZATION_ID' && env.SIGNPATH_PROJECT_SLUG != 'REPLACE_WITH_SIGNPATH_PROJECT_SLUG' && env.SIGNPATH_SIGNING_POLICY_SLUG != 'REPLACE_WITH_SIGNPATH_SIGNING_POLICY_SLUG' }}
        uses: actions/upload-artifact@v4
        with:
          name: prompt-magnus-desktop-windows-signed
          path: signed/**
          if-no-files-found: error

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File -Include *.exe,*.msi,*.zip |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              "$($hash.Hash)  $($_.Name)"
            } | Set-Content -Path checksums/SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: prompt-magnus-desktop-windows-checksums
          path: checksums/SHA256SUMS.txt
          if-no-files-found: error
